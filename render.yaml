services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"

      # Free Render has only 512 MB RAM.
      # This may still be too small for some OpenClaw versions.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"

      # Use writable temporary directories because Free cannot attach a disk.
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw

      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace

      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true

      # Set at least one provider key.
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      # Optional providers
      - key: OPENROUTER_API_KEY
        sync: false

      - key: MOONSHOT_API_KEY
        sync: false

      - key: MINIMAX_API_KEY
        sync: false
